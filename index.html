</style><body><div class="bar"><span class="brand"><b>φ</b>Archivio Leonardo Pisano</span><div class="row" id="top"></div></div><main id="home"><div class="eyebrow">23 novembre · Escape room per la secondaria</div><h1>Fibonacci <em>Day</em></h1><p>Sei stanze per riparare il dossier di A.R.M.O.N.I.A. Saprete distinguere una somiglianza da una prova?</p><div class="row"><button class="primary" onclick="begin()">Entra nell’archivio →</button><button onclick="videoIntro()">▷ Guarda la missione</button><button onclick="book()">▤ Liber Abaci</button></div></main><main id="game"><div id="caption"></div><div id="view" tabindex="0" aria-label="Ambiente panoramico a 360 gradi"><div id="objects"></div><div class="views"><button onclick="pan(-30)" aria-label="Ruota a sinistra">←</button><button onclick="pan(30)" aria-label="Ruota a destra">→</button><button onclick="zoomBy(-.1)" aria-label="Allontana">−</button><button onclick="zoomBy(.1)" aria-label="Avvicina">+</button><button onclick="gyro()" aria-label="Attiva o disattiva giroscopio">◎</button></div></div><div class="row tools" id="toolbar"></div></main><footer><button onclick="newGamePrompt()">Nuova partita</button><button onclick="instructions()">Istruzioni</button><button onclick="privacy()">Privacy</button><button onclick="license()">Licenza</button></footer><dialog id="dlg"><header><h2 id="title"></h2><button onclick="closeDlg()" aria-label="Chiudi">✕</button></header><div id="body"></div></dialog><div id="toast" role="status" hidden></div><script>
const Q={"17": ["sbagliato"], "56": ["Chiedi a Leonardo"], "60": ["Archivio Leonardo Pisano, 23 novembre. A.R.M.O.N.I.A., l’archivio digitale che custodisce il Liber Abaci, ha cominciato a vedere Fibonacci dappertutto: nei conigli, nelle api, nelle spirali, nelle melodie, perfino nel corpo umano. Ha compilato un dossier di affermazioni, ma non sa più distinguere quali siano vere. Le porte si sono chiuse. Per uscire dovete riparare il dossier: in ogni stanza esplorate, costruite, verificate. Attenzione ai falsi indizi."], "61": ["Ho trovato Fibonacci dappertutto!"], "64": ["Il tempo previsto è finito, ma l’archivio aspetta. Continuate."], "76": ["Mese 1: una coppia giovane. Mese 2: ancora una coppia. Dal terzo mese, somma i totali dei due mesi precedenti. Cerca i numeri che pensi appartengano alla successione. Tocca i gettoni per aggiungerli alla pergamena, poi aprila e sistemali nei mesi corrispondenti."], "80": ["Liber Abaci, 1202. Dopo un anno: 377 coppie."], "84": ["somma dei due mesi precedenti", "La gabbia è piccola: qui servono i calcoli."], "100": ["Giusto: [a] + [b] = [c]."], "101": ["Questo numero fa parte della successione, ma non è il totale di questo mese: somma i totali dei due mesi precedenti."], "102": ["377 appartiene alla successione, ma viene dopo l’ultimo mese della pergamena."], "103": ["Questo numero non è la somma di due totali consecutivi."], "104": ["Un compagno dice: “Se il modello è irrealistico, la successione è sbagliata”. Che cosa rispondi?"], "105": ["Hai ragione: la successione non vale.", "I calcoli derivano correttamente dalle ipotesi dichiarate: non sono sbagliati."], "106": ["La successione è corretta per le ipotesi del modello; sono le ipotesi a essere poco realistiche.", "Esatto. Il calcolo segue le regole del modello: nessuna coppia muore e ogni coppia adulta genera una nuova coppia ogni mese."], "107": ["La successione descrive esattamente come crescono i conigli veri.", "I conigli veri muoiono e non nascono a coppie regolari: il modello è idealizzato."], "108": ["Quante coppie ci sono al mese 13?"], "109": ["Conigli ovunque! Ora le api!"], "110": ["377 è il totale del mese 14. Controlla l’ultima casella della pergamena."], "111": ["144 è il totale del mese 12. Manca ancora un mese."], "112": ["Il totale del mese 13 si ottiene sommando i totali dei mesi 11 e 12."], "114": ["Leggi il cartellino sotto la ciotola.", "Mese 3 = 1 + 1. Come trovi il mese 4?", "Dal terzo mese ogni totale è la somma dei due precedenti: 1, 1, 2, 3, 5, 8…"], "115": ["Distingui il calcolo dalle ipotesi.", "Che cosa è poco realistico: i numeri o le regole da cui partono?", "La successione segue le regole del modello; sono le regole a non descrivere i conigli veri."], "116": ["Guarda l’ultima casella della pergamena.", "È il tredicesimo numero della tabella.", "Il codice ha tre cifre e coincide con l’ultima casella."], "117": ["Un modello può essere matematicamente corretto anche se le sue ipotesi sono idealizzate."], "127": ["Un fuco nasce da un uovo non fecondato: ha una madre e nessun padre. Un’ape femmina nasce da un uovo fecondato: ha una madre e un padre, che è un fuco."], "131": ["2, 1, 3, 4, 7, 11, 18, ?"], "135": ["Un fuco non ha padre."], "151": ["Giusto."], "152": ["madre", "La madre è sempre una femmina."], "153": ["padre", "Il padre è sempre un fuco, cioè un maschio."], "154": ["Un fuco non ha padre."], "155": ["Giusto.", "Quante caselle ha questo livello? Confronta con i due livelli precedenti.", "Quale relazione riconosci?"], "156": ["Ogni livello è la somma dei due precedenti.", "È la successione di Fibonacci."], "157": ["Ogni livello è il doppio del precedente.", "Raddoppierebbe: 1, 2, 4, 8… qui invece 1, 1, 2, 3, 5."], "158": ["Ogni livello ha una casella in più del precedente.", "Controlla i primi livelli: 1, 1, 2, 3, 5."], "159": ["L’albero ha 13 posizioni alla generazione 7. Quante api diverse ci sono sicuramente in un alveare reale a quel livello?"], "160": ["Esattamente 13.", "In un alveare reale una stessa ape può occupare più posizioni (parentele incrociate)."], "161": ["Al massimo 13: una stessa ape può occupare più posizioni.", "Esatto: il conteggio teorico è un massimo. E ricorda: la genealogia dei fuchi è un’osservazione moderna; nel 1202 Fibonacci parlava di conigli."], "162": ["Più di 13.", "Il conteggio teorico è un massimo, non un minimo."], "163": ["Posizioni alla generazione 7 (due cifre) e termine che segue 18 nella sequenza misteriosa (due cifre)"], "164": ["Api, conigli… tutto torna! O forse no?"], "165": ["Le prime due cifre sono giuste. Controlla la sequenza misteriosa: da quali numeri parte e che regola segue?"], "166": ["Le ultime due cifre sono giuste. Controlla il conteggio alla generazione 7."], "167": ["Hai invertito le due parti."], "168": ["Servono due numeri di due cifre: le posizioni alla generazione 7 e il termine che segue 18 nel disco di propoli."], "170": ["Ricorda chi sono la madre e il padre di un fuco.", "Parti dal fuco: ha una sola madre, e la madre ha due genitori.", "Ogni ♀ ha madre e padre; ogni ♂ ha solo la madre."], "171": ["Conta le caselle di ogni livello dell’albero.", "Guarda come ottieni il livello 4 dai livelli 2 e 3.", "1, 1, 2, 3, 5: ogni numero è la somma dei due precedenti."], "172": ["La sequenza misteriosa segue una regola additiva.", "Somma sempre gli ultimi due numeri.", "11 + 18 = ?"], "173": ["Contare le posizioni di un albero non è contare gli individui reali: il modello e la realtà vanno tenuti distinti."], "180": ["Aritmetica"], "187": ["mod"], "195": ["I due rettangoli sono simili."], "199": ["x / 1 = 1 / (x − 1)", "x · (x − 1) = 1", "x² − x = 1", "x² − x − 1 = 0", "x = (1 + √5) / 2", "x² + x − 1 = 0", "x = (1 − √5) / 2"], "207": ["x ≈ 1,618"], "211": ["I rapporti tra termini consecutivi sono sempre minori di 1,618."], "218": ["Giusto.", "Controlla l’arrotondamento a quattro cifre decimali.", "Ricalcola: [numeratore] diviso [denominatore]."], "219": ["Giusto: i rettangoli sono simili.", "Giusto: prodotto dei medi e degli estremi.", "Giusto: sviluppo il prodotto.", "Giusto: porto tutto a sinistra.", "Giusto: formula risolutiva, soluzione positiva."], "220": ["Questo passaggio viene dopo un altro: da quale uguaglianza lo ottieni?"], "221": ["Controlla i segni: portando 1 a sinistra, che cosa succede a x² − x?"], "222": ["Questa soluzione è negativa: x è la lunghezza di un lato, serve la positiva."], "224": ["Seleziona i rapporti che smentiscono l’affermazione"], "225": ["Esatto: i rapporti oscillano, a volte sopra e a volte sotto 1,618, e si avvicinano senza mai coincidere."], "226": ["[rapporto] è minore di 1,618: non smentisce l’affermazione."], "227": ["Ne esistono altri: confronta ogni rapporto con 1,618."], "228": ["Le prime quattro cifre di φ, senza virgola"], "229": ["φ è irrazionale: ha infinite cifre decimali, senza periodo. Qui ne bastavano quattro."], "230": ["È l’approssimazione 34/21 = 1,6190: vicina, ma φ è la soluzione esatta dell’equazione."], "231": ["È 13/8: un rapporto di interi, non φ."], "232": ["Calcola (1 + √5) / 2 con la calcolatrice."], "234": ["Il foglio di Leonardo contiene la prima uguaglianza.", "Se due rettangoli sono simili, i rapporti tra i lati sono uguali.", "Da x / 1 = 1 / (x − 1) segue x · (x − 1) = 1."], "235": ["Confronta ogni rapporto con 1,618.", "Alcuni stanno sopra, altri sotto.", "Smentiscono l’affermazione i rapporti maggiori di 1,618."], "236": ["φ è la soluzione positiva trovata prima.", "Usa la calcolatrice sull’ultima tessera.", "Il codice comincia con 16 e finisce con 18."], "237": ["I rapporti tra termini consecutivi si avvicinano a φ senza mai coincidere: un’approssimazione non è un’identità."], "263": ["Questa curva è la spirale aurea perfetta."], "267": ["Lato corto, lato lungo del rettangolo finale"], "271": ["Giusto: il rettangolo ora misura [a] × [b]."], "272": ["Questo quadrato ha lato [x], ma il lato su cui si appoggia misura [y]."], "273": ["Il lato 4 non compare mai: ogni quadrato ha il lato uguale al lato lungo del rettangolo già costruito."], "274": ["Giusto.", "Misura i lati del rettangolo che hai costruito, non del quadrato appena posato.", "Dividi il lato lungo per il lato corto."], "275": ["Questo arco c’è già."], "277": ["La curva che hai disegnato coincide esattamente con una spirale logaritmica aurea?", "Sì, è la spirale aurea.", "Il cartiglio lo dice, ma controlla: da che cosa è formata la curva?", "No: è fatta di archi di circonferenza raccordati, quindi è un’approssimazione detta spirale di Fibonacci.", "Esatto.", "Sì, se i quadrati diventano abbastanza grandi.", "Ingrandire i quadrati non cambia la natura degli archi: restano archi di circonferenza."], "278": ["Togli dal rettangolo 8 × 13 il quadrato di lato 8: resta un rettangolo 5 × 8. Ha lo stesso rapporto tra i lati?", "Sì, esattamente.", "Calcola i due rapporti: 13/8 e 8/5.", "No: 13/8 = 1,625 e 8/5 = 1,6: sono vicini, non uguali.", "Esatto. Nel rettangolo aureo ideale il rapporto resterebbe esattamente φ."], "280": ["Che curva meravigliosa! Perfetta, vero? …Vero?"], "281": ["Il lucchetto chiede prima il lato corto, poi il lato lungo."], "282": ["Questi sono i lati del rettangolo dopo il quadrato 5: il rettangolo finale ha un quadrato in più."], "283": ["Servono i lati del rettangolo finale: prima il corto, poi il lungo."], "285": ["Il nuovo quadrato si appoggia al lato più lungo.", "Dopo 1 e 1 il rettangolo è 1 × 2: quanto misura il lato lungo?", "Dopo 1, 1 e 2 il rettangolo è 2 × 3: il quadrato successivo ha lato 3."], "286": ["Di quali figure è fatta la curva?", "Una spirale logaritmica ha un raggio che cresce con continuità.", "Gli archi sono di circonferenza: la curva è un’approssimazione."], "287": ["Guarda le misure del taccuino.", "Cerca il rettangolo dopo il quadrato 8.", "Il rettangolo finale è 8 × 13."], "288": ["La spirale costruita con archi di circonferenza somiglia alla spirale aurea, ma non è la spirale aurea."], "306": ["Suona", "Aggiungi all’elenco"], "322": ["Resto della divisione per 7: 1 = Do, 2 = Re, 3 = Mi, 4 = Fa, 5 = Sol, 6 = La, 0 = Si."], "330": ["Registra", "Cancella ultima", "Svuota", "Ascolta", "Casuale", "Verifica"], "338": ["Trovato."], "339": ["Questo lo avevi già."], "340": ["Questo ritmo dura [k] pulsazioni invece di [n]."], "341": ["Ho trovato tutti", "Ne manca ancora qualcuno."], "343": ["Confronta con i due valori precedenti della tabella."], "344": ["Perché i ritmi di durata n sono la somma di quelli di durata n−1 e n−2?", "Li raggruppo secondo l’ultimo suono: se finisce con B restano n−1 pulsazioni, se finisce con L ne restano n−2.", "Esatto: il cassettone si apre.", "Perché ogni ritmo si può raddoppiare.", "Raddoppiare non spiega 1, 2, 3, 5, 8: guarda come finiscono i ritmi.", "Perché i numeri di Fibonacci sono dappertutto.", "Questa è una constatazione, non una spiegazione: serve un ragionamento sulla struttura dei ritmi."], "345": ["mod", "Verifica"], "346": ["La melodia ha [k] note: i termini sono 21."], "347": ["La nota n. [k] non corrisponde. Il termine n. [k] è [F]: calcola [F] diviso 7 e guarda il resto."], "348": ["Registra", "Questo tasto suona, ma non fa parte della codifica: i resti vanno da 0 a 6 (da Do a Si)."], "349": ["Melodia corretta. Ascolta bene le ultime note: ti ricordano qualcosa?"], "351": ["Hai ascoltato la melodia di Fibonacci e, se vuoi, una melodia casuale. Se preferisci la prima, hai dimostrato una proprietà matematica?", "Sì: se la melodia piace, ha una struttura matematica.", "Il gradimento è soggettivo: una melodia casuale può piacere altrettanto.", "No: il gradimento è soggettivo; la ripetizione delle note, invece, si può verificare.", "Dipende da chi ascolta, quindi la ripetizione non è un fatto.", "La ripetizione non dipende da chi ascolta: si controlla con i resti."], "352": ["Perché la melodia ricomincia?", "I resti modulo 7 hanno solo 7 valori possibili e ogni termine dipende dai due precedenti: prima o poi una coppia di resti si ripete e da lì tutto si ripete.", "Esatto: è una proprietà dimostrabile dei resti.", "Perché il compositore ha voluto una ripresa.", "Nessun compositore: la successione è la stessa per tutti.", "Per caso.", "Non è un caso: ogni termine dipende dai due precedenti."], "353": ["Dopo quante note la melodia ricomincia?"], "354": ["Che musica! Le note di Fibonacci suonano benissimo… o sono io a sentirle così?"], "355": ["La nota 16 fa ancora parte del primo giro: è un Si."], "356": ["La nota 17 è la prima del secondo giro: il primo giro ne ha 16."], "357": ["Quante note ci sono prima che Do Do Re Mi Sol ricompaia?"], "359": ["Costruisci i ritmi cominciando sempre con B, poi con L.", "Raggruppa i ritmi secondo l’ultimo suono.", "Se finisce con B restano n−1 pulsazioni; se finisce con L ne restano n−2."], "360": ["La tabella di codifica è nel cassettone, sotto lo spartito.", "Dividi ogni numero per 7 e guarda solo il resto.", "Il resto 0 corrisponde a Si. Esempio: 21 diviso 7 fa 3 con resto 0, quindi Si."], "361": ["Confronta le ultime note con le prime.", "Quale gruppo di note compare due volte?", "Do Do Re Mi Sol ricompare dalla nota 17."], "362": ["La ripetizione delle note è un fatto matematico dimostrabile; il piacere di una melodia è un giudizio personale."], "372": ["Fatto matematico dimostrato", "Osservazione o approssimazione", "Ipotesi o interpretazione da verificare", "Formulazione scorretta"], "380": ["Un’analisi di un brano individua un evento alla battuta 55 su 89: 55/89 ≈ 0,618."], "384": ["Fissare in anticipo il criterio con cui si segmenta il brano", "Dichiarare in anticipo come si contano le battute", "Confrontare con altri brani per vedere quante volte un evento cade vicino a 0,618 anche per caso", "Ascoltare il brano e giudicare a orecchio", "Arrotondare 55/89 a 0,6 per avvicinarlo", "Considerare solo i punti che confermano e ignorare gli altri"], "396": ["Le prime sette cifre di φ, senza virgola e senza arrotondare"], "402": ["Il rapporto tra termini consecutivi di Fibonacci tende a φ."], "405": ["Il corpo umano possiede sempre proporzioni auree."], "408": ["La doppia elica del DNA è una spirale aurea piana."], "411": ["Da Do a Do inclusi si contano 13 tasti: 8 bianchi e 5 neri."], "414": ["La vicinanza a φ dimostra che un compositore l’ha usato intenzionalmente."], "417": ["Un rapporto di misure vicino a φ può essere un dato interessante da indagare."], "421": ["Controlla i cassetti"], "422": ["Il dossier è riparato a metà. Ora l’analisi del brano."], "423": ["[k] carte su 6 sono nel cassetto sbagliato."], "424": ["Esiste una dimostrazione: il limite del rapporto è (1 + √5) / 2.", "La parola “sempre” rende scorretta l’affermazione: le misure reali variano.", "La doppia elica è tridimensionale: gli studi trovano rapporti vicini a φ, non una spirale aurea piana.", "Il conteggio è esatto, ma non è un teorema e non prova una causa legata a Fibonacci.", "La vicinanza numerica non prova l’intenzione.", "Un rapporto vicino a φ è un dato da indagare, non una prova."], "425": ["Il conteggio è verificabile, ma non è un teorema: quale cassetto descrive un’osservazione?"], "426": ["Un’analisi individua un evento alla battuta 55 su 89: 55/89 ≈ 0,618. Dimostra che l’autore ha progettato il brano secondo la sezione aurea? Scegli le verifiche che servono davvero."], "427": ["Esatto: un solo dato non basta. Servono criteri decisi prima e confronti."], "428": ["Il gradimento è soggettivo e non verifica nulla."], "429": ["Arrotondare per far tornare i conti è proprio ciò che va evitato."], "430": ["Scegliere solo ciò che conferma è un errore di metodo."], "431": ["Manca almeno una verifica necessaria."], "432": ["Per l’ultima porta servono più cifre di quelle che la calcolatrice mostrava. Ricorda che φ è la soluzione positiva di x² − x − 1 = 0."], "435": ["Hai arrotondato. Le prime sette cifre non si arrotondano: sono quelle che compaiono nello sviluppo decimale, nell’ordine. Guarda la settima cifra senza arrotondarla."], "436": ["Le prime quattro cifre sono giuste. Servono più cifre: la calcolatrice di precisione te le mostra."], "437": ["Calcola (1 + √5) / 2 con la calcolatrice di precisione e copia le prime sette cifre, senza la virgola."], "439": ["Chiediti: esiste una dimostrazione? È una misura? È un’interpretazione? È una frase scorretta?", "Le parole sempre e dimostra sono segnali da controllare.", "La carta 1 è l’unica dimostrata."], "440": ["Un solo dato non basta.", "Servono scelte fatte prima di guardare i dati e confronti con altri casi.", "Sono giuste le tre carte che parlano di criterio, conteggio e confronto."], "441": ["φ è la soluzione positiva dell’equazione della stanza 3.", "Calcola (1 + √5) / 2 con la calcolatrice di precisione.", "Il risultato comincia con 1,618033: scrivi le prime sette cifre senza virgola e senza arrotondare."], "442": ["Un numero vicino a φ è un indizio da indagare, non la prova di un’intenzione o di una legge."], "446": ["Il mio dossier era pieno di errori. Ho cercato Fibonacci dappertutto e l’ho trovato anche dove non c’era."], "447": ["La porta si è aperta, ma non perché un numero somigliava a un altro. Si è aperta perché lo avete calcolato, controllato e distinto. 1,618033 e 2584/1597 cominciano allo stesso modo, eppure non sono uguali: nessun rapporto di numeri interi è uguale a φ. Una melodia che piace, un rapporto vicino a 0,618, una spirale che sembra perfetta sono indizi, non dimostrazioni. Somigliare non è coincidere: per questo si verifica, si confronta e si dichiara quali ipotesi si usano. Fibonacci non è dappertutto: lo trovate dove il modello è davvero valido e, qualche volta, lo cercate dove vorreste che ci fosse."], "448": ["Scarica il rapporto"], "449": ["Quale indizio sembrava vero e non lo era?", "In quale stanza avete distinto un fatto da un’approssimazione?", "Fibonacci è dappertutto oppure talvolta siamo noi a cercarlo dappertutto?"]};

function findCount(){const ids=finds[r],pieces=variants[r];return (ids.filter(k=>s.seen[k]).length+pieces.filter(v=>gathered()[v.id]).length)+' / '+(ids.length+pieces.length)}
function migratePieces(){if(r===1&&!s.data.monthEdition){const old=s.placed[1];if(old&&Object.keys(old).length){s.placed[1]=Object.fromEntries(Object.entries(old).map(([i,v])=>[Number(i)+1,v]));if(s.p>1){s.placed[1][2]='2';gathered()['1-E-2']=true}}s.data.monthEdition=1}if(s.data.collectionVersion)return;
 for(let v of variants[r]){const n=phases[r].indexOf(v.phaseName);if(n<s.p||Object.values(s.placed[n]||{}).includes(v.value))gathered()[v.id]=true}
 s.data.collectionVersion=1
}
function pastAt(i){return stations[r].flatMap((k,n)=>k&&k===alpha[i]&&n<(liveGame?.rooms[r]?.p??s.p)&&phases[r][n]!=='Chiave'&&phases[r][n]!=='Cassettone'?[n]:[])}
function pastButtons(i){return pastAt(i).map(n=>btn('Ripeti · '+phases[r][n],'practice('+n+')')).join(' ')}
function toolsBox(){modal('Strumenti',btn('Taccuino','notebook()','choice')+infoList()+(hasCalculator()?btn('Calcolatrice di Leonardo','calculator()','choice'):'')+btn('Torna alla stanza','closeDlg()'))}
function noteBox(key,text){
 const saved=g.notes.find(n=>n[0]===r&&n[3]===key);
 return '<form class="paper" onsubmit="saveFind(event,'+esc(JSON.stringify(key))+','+esc(JSON.stringify(text))+')"><label>Appunto personale (facoltativo)<br><textarea name="annotation" maxlength="1600">'+esc(saved?.[2]||'')+'</textarea></label><button>'+(saved?'Aggiorna nel taccuino':'Salva nel taccuino')+'</button><output aria-live="polite"></output></form>';
}
function saveFind(e,key,text){e.preventDefault();const form=e.currentTarget,entry=[r,text,form.elements.annotation.value.trim(),key];const at=g.notes.findIndex(n=>n[0]===r&&n[3]===key);if(at<0)g.notes.push(entry);else g.notes[at]=entry;save();form.querySelector('output').textContent=' ✓ Salvato';form.querySelector('button').textContent='Aggiorna nel taccuino'}
function findPanel(i,text,extra=''){modal(specs[r][i][0],extra+'<p>'+esc(text)+'</p>'+noteBox(itemID(i),text)+pastButtons(i)+btn('Torna alla stanza','closeDlg()'))}
function sceneVideo(manual=false){
 const room=s,movie=document.createElement('video');movie.preload='metadata';movie.controls=true;movie.playsInline=true;
 movie.onloadedmetadata=()=>{if(r!==5||room!==s||editor)return;if(!manual&&$('dlg').open){s.data.videoPending=true;return}modal('Sala Musica · Introduzione','<div id="filmSlot"></div>'+btn('Passa alla domanda','musicLapseQuiz()'));$('filmSlot').append(movie);s.data.videoPending=false;s.data.filmSeen=true;save();movie.play().catch(()=>{})};
 movie.onended=()=>{if(r===5&&room===s&&movie.isConnected&&$('dlg').open)musicLapseQuiz()};
 movie.onerror=()=>{if(manual&&room===s)notify('Video non disponibile. Puoi esplorare la sala.')};movie.src='scena5.mp4';
}
function hiveProgress(){
 if(r!==2||liveGame||editor)return;
 const finalEvidence=g.tiles.includes(2)||g.logs.some(row=>row[1]===2&&row[2]==='Verifica'&&row[3]==='corretta'&&row[4]===Q[161][0]);
 if(finalEvidence&&s.p<5)s.p=5;
 if(finalEvidence&&!g.tiles.includes(2))g.tiles.push(2);
}
function hiveTarget(){
 const key=doorOpen()||doorReady()?'F':currentStation();
 if(!key)return;
 const p=pos(alpha.indexOf(key));yaw=p.ang;pitch=p.alt;scene();
 const object=$('objects').querySelector('[data-obj="'+alpha.indexOf(key)+'"]');
 object?.focus({preventScroll:true});
}
function finishPhase(message){closeDlg();if(r===2&&phase()==='Chiave'){hiveTarget();lock();return}notify(message+' '+((r===5&&phase()==='Chiave')?'Il lucchetto è pronto.':currentStation()?'Cerca '+specs[r][alpha.indexOf(currentStation())][0]+'.':''))}
function stationClick(i,moved=false){

 const a=specs[r][i],k=alpha[i],f=phase();
 if(!visible(i))return;
 if(a[4]==='v')return scenePiece(i,null,false);
 if(a[4]==='decoy'){if(!s.moves[itemID(i)])s.moves[itemID(i)]=[12,-2];save();scene();return}
 if(!visible(i))return;
 if(a[4]==='k'&&doorOpen()){modal(a[0],btn(r===6?'Apri il dossier finale':'Attraversa la porta',r===6?'openFinal()':'enter('+(r+1)+')'));return}
 if(a[4]==='k'&&doorReady()){if(liveGame)returnLive();lock();return}
 if(r===1&&k==='B'){discover('B');if(f==='Costruisci')return months();if(f==='Verifica')return question(104);findPanel(i,q(80));return}
 if(k===currentStation()&&f!=='Cassettone'){if(r===6&&k==='F')discover('F');feedback='';selection=null;work();return}
 if(a[4]==='k'&&f==='Conclusa'){modal(a[0],btn(r===6?'Apri il dossier finale':'Attraversa la porta',r===6?'finale()':'enter('+(r+1)+')'));return}
 if(r===3&&k==='A'&&!s.seen.A&&!moved){notify('Sposta il quaderno per guardare sotto. Da tastiera usa una freccia mentre il quaderno è selezionato.');return}
 if(r===4&&k==='E'){discover(k);findPanel(i,q(263),cartiglioCurve()+btn('La spirale aurea · verifica l’affermazione','spiralQuiz()'));return}
 if(r===1&&k==='C'){rabbits();return}
 if(r===5&&k==='H'){pianoPanel();$('body').insertAdjacentHTML('beforeend',pastButtons(i));$('body').insertAdjacentHTML('beforeend',noteBox('5-H','La tastierina ha otto tasti bianchi e cinque neri.'));return}
 if(r===5&&k==='A'){metro();$('body').insertAdjacentHTML('beforeend',noteBox('5-A','Il metronomo scandisce le pulsazioni.'));return}
 if(r===5&&'EFG'.includes(k)){const t=k==='E'?'Aprendo il cassettone estrai lo spartito e la tabella di codifica. Ora puoi esaminarli nella sala.':k==='F'?fib.join(', '):q(322);discover(k);if(f==='Cassettone'&&['E','F','G'].every(x=>s.seen[x])){s.p++;save();draw()}findPanel(i,t);return}
 if(r===3&&k==='B'){g.calc=true;discover(k);findPanel(i,'Hai raccolto la calcolatrice di Leonardo. La ritrovi in Strumenti.');return}
 if(required[r].includes(k)){let t=a[5]?q(a[5]):r===3?'Sotto il quaderno trovi la calcolatrice di Leonardo.':r===6?cards.join(' · '):r===4?'Registra le dimensioni dei rettangoli ottenuti con i quadrati di lato 5 e 8.':'Conta i ritmi che riempiono ciascuna durata da 1 a 5.';if(r===3&&k==='D')t='Dal rettangolo di lati 1 e x si toglie un quadrato unitario. Il rettangolo di lati 1 e x − 1 è simile al rettangolo di partenza.';if(a[4]==='c'&&!s.moves[k])s.moves[k]=[16,-3];discover(k);findPanel(i,t,r===3&&k==='D'?'<svg width="200" viewBox="0 0 180 115"><rect x="5" y="5" width="162" height="100" fill="#efcf91" stroke="#77592d"/><path d="M105 5v100" stroke="#77592d"/><text x="37" y="60">1 × 1</text><text x="110" y="60">x − 1</text></svg>':'');return}
  if(pastAt(i).length)modal(a[0],pastButtons(i)+btn('Torna alla stanza','closeDlg()'));
}

function hasCalculator(){return Boolean(g?.rooms?.[3]?.seen?.B)}
function doorOpen(){const game=liveGame||g;return Boolean(game.rooms[r]?.data?.unlocked||game.max>r||(r===6&&game.finished))}
function doorReady(){const room=(liveGame||g).rooms[r];return room.p>=phases[r].indexOf('Chiave')||(r===5&&room.p>phases[5].indexOf('Note'))}
function openFinal(){if(liveGame)returnLive();finale()}
function newGamePrompt(){if(!g)return begin();modal('Iniziare una nuova partita?', '<p>Partita, appunti e registro del gruppo saranno cancellati da questo browser. I posizionamenti degli oggetti e le impostazioni docente saranno conservati.</p>'+btn('Annulla','closeDlg()')+' '+btn('Azzera e inizia','restartGame()','primary'))}
function restartGame(){liveGame=null;playing=false;editor=false;r=0;s={};g=null;stopAudio();recording=false;selection=null;acc=0;op=null;replace=true;display='0';save();closeDlg();$('game').style.display='none';$('home').hidden=false;$('top').innerHTML='';document.querySelector('#home .primary').textContent='Entra nell’archivio →';begin()}
function cartiglioCurve(){return '<svg role="img" aria-label="Curva composta da sei quarti di circonferenza nei quadrati di Fibonacci" style="display:block;max-width:420px;width:100%" viewBox="-.2 -.2 13.4 8.4">'+geom.map(([x,y,l],i)=>'<rect x="'+x+'" y="'+y+'" width="'+l+'" height="'+l+'" fill="'+colors[i]+'" stroke="#564a38" stroke-width=".04"/>').join('')+'<path d="'+curves.join(' ')+'" fill="none" stroke="#662e12" stroke-width=".14"/></svg>'}
function spiralQuiz(){modal('La spirale aurea','<p>Sai cos’è una spirale aurea?</p>'+['La spirale aurea è una particolare curva geometrica che si sviluppa seguendo la sezione aurea (o proporzione aurea), ossia il rapporto matematico e geometrico pari a circa 1,618 (rappresentato dalla lettera greca φ - Phi)','è la spirale delle galassie','è ogni spirale che si trova in natura'].map((v,i)=>btn(v,'spiralAnswer('+i+')','choice')).join('')+'<div id="spiralFeedback" role="status"></div>')}
function spiralAnswer(i){const text=i===0?'Esatto. È un caso particolare di spirale logaritmica e un modello matematico ideale; in natura molte curve le assomigliano ma seguono spesso fattori di crescita diversi.':'Riprova. In natura molte curve le assomigliano ma seguono spesso fattori di crescita diversi.';$('spiralFeedback').innerHTML='<p>'+text+'</p>'+(i===0?noteBox('spirale-aurea',text):'')}

const infoTitles={1:'Il modello dei conigli',2:'Fibonacci e l’alveare',5:'Ritmi di Fibonacci'};
function infoAvailable(n){return !!infoTitles[n]&&g.max>n}
function infoButton(n){return infoAvailable(n)?btn((g.savedInfo?.[n]?'✓ Salvata · ':'Infografica · ')+infoTitles[n],'openInfo('+n+')','choice'):''}
function infoList(){return [1,2,5].map(infoButton).join('')}
function saveInfo(n){if(!infoAvailable(n))return;const game=liveGame||g;(game.savedInfo??={})[n]=true;if(liveGame)g.savedInfo={...game.savedInfo};try{localStorage.setItem('fibo-game-1',JSON.stringify(game))}catch{}openInfo(n)}
function openInfo(n){if(!infoAvailable(n))return;const file=n===5?'info4.png':'info'+n+'.png';modal(infoTitles[n],'<img style="max-width:100%;height:auto" src="'+file+'" alt="'+infoTitles[n]+'">'+(n===5?'<p>La regola dei ritmi si legge R(n) = R(n − 1) + R(n − 2). B vale una pulsazione, L ne vale due.</p>':'')+(g.savedInfo?.[n]?'<p>✓ Salvata negli Strumenti</p>':btn('Salva negli Strumenti','saveInfo('+n+')'))+' <a href="'+file+'" download="'+file+'">Esporta come PNG</a> '+btn('Torna agli Strumenti','toolsBox()'))}

function musicLapseQuiz(){
 modal('Le parole di Leonardo','<p>Parlando dei modi per arrivare al terzo gradino, Leonardo ha avuto un lapsus. Lo hai notato?</p>'+['Ha detto due invece di tre.','Ha detto tre invece di due.','Non ha fatto errori.'].map((label,i)=>btn(label,'musicLapseAnswer('+i+')','choice')).join('')+'<div id="musicReply" role="status"></div>');
}
function musicLapseAnswer(i){
 const correct=i===0;
 const text=correct?'Esatto! Anche Leonardo è umano e può avere qualche lapsus mentre parla! 😂 I modi sono tre: 1 + 1 + 1, 1 + 2 e 2 + 1.':'Riprova. Parti da terra e prova a elencare i percorsi con passi da uno o due gradini.';
 $('musicReply').innerHTML='<p>'+text+'</p>'+(correct?noteBox('terzo-gradino',text)+btn('Esplora la Sala Musica','closeDlg()','primary'):'');
}
</script></body></html>
